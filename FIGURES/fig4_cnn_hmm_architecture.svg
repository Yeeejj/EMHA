   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(147.82125 60.660562)">Fine-tuned</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(149.763125 70.262125)">ResNet18</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(139.26 79.864313)">conv1 .. layer3</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(254.00125 65.461031)">Average over</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(267.87 75.063219)">height</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(356.354375 60.660875)">Column sequence</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(377.231875 70.262438)">T x 256</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(367.82625 79.864)">(T = W / 16)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(485.53 60.660562)">Standardize</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(496.835625 70.262125)">+ PCA</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(480.135625 79.864313)">(inner-train fit)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(616.425 37.741031)">HMM HAPPY</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(607.874375 47.343219)">(Gaussian, diag)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(620.918125 98.725031)">HMM SAD</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(607.874375 108.327219)">(Gaussian, diag)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(472.43 181.885031)">LL_SAD / T - LL_HAPPY / T</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(491.476875 191.487219)">+ log prior ratio</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(353.856875 177.084563)">Platt scaling</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(344.088125 186.68675)">(inner-validation)</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(340.310625 196.288313)">-&gt; P(SAD) per crop</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(192.388125 177.08425)">Mean per family</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(183.279375 186.686438)">(word, cursive), then</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(186.1775 196.288625)">equal-weight mean</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(46.52625 177.084563)">Participant</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(38.6925 186.68675)">P(SAD); SAD if</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(56.188125 196.288313)">&gt;= 0.5</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b6b6b" transform="translate(581.94 149.04759)">states, PCA size, topology</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b6b6b" transform="translate(581.94 157.449504)">chosen on inner validation</text>
   </g>
